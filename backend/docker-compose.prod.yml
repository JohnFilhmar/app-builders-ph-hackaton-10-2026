# Production stack for tara.filhmar.online. Host nginx terminates TLS and proxies to 127.0.0.1:8787;
# the port is bound to loopback only, so nothing reaches the container except through nginx.
# Run from the repo root:  docker compose -f backend/docker-compose.prod.yml up -d --build
name: tara-production

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: tara-backend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      PORT: "8787"
      # the game rules count days (daily caps, streaks) in local time; players are in the Philippines, as the phone is
      TZ: Asia/Manila
    volumes:
      # leaderboard.json and benchmark results survive rebuilds
      - tara_data:/app/backend/data
      # optional model mirror: drop .gguf/.bin files here to serve them instead of Hugging Face
      - tara_models:/app/backend/models:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tara_data:
  tara_models:
