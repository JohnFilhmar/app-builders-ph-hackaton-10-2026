# nginx site for tara.filhmar.online: the Tara backend (landing page, model catalog, leaderboard).
#
# The container publishes 127.0.0.1:8787 only (backend/docker-compose.prod.yml), so it is reachable through this
# proxy and nothing else. HTTP-only on purpose: `certbot --nginx` adds the 443 server and the redirect in place.
#
# Usage (on the box):
#   cp docs/nginx/tara.filhmar.online.conf /etc/nginx/sites-available/tara
#   ln -sf /etc/nginx/sites-available/tara /etc/nginx/sites-enabled/tara
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d tara.filhmar.online

upstream tara_backend {
    server 127.0.0.1:8787;
}

# leaderboard joins and uploads; the app syncs on tab focus and each upload is one small request
limit_req_zone $binary_remote_addr zone=tara_lb:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name tara.filhmar.online;

    # a leaderboard upload is at most 400 ledger events, well under 1 MB
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # benchmark results from the feasibility lab are a laptop-only tool; keep them off the public server
    location ^~ /results {
        return 404;
    }

    location /lb {
        limit_req zone=tara_lb burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://tara_backend;
    }

    # mirrored model files are hundreds of MB: stream them instead of buffering to disk
    location /files/ {
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_pass http://tara_backend;
    }

    location / {
        proxy_pass http://tara_backend;
    }
}
